name: Build Jarvis APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          unzip -q jarvis-project.zip
          cd jarvis
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Jarvis.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} Jarvis.apk --repo ${{ github.repository }} --title "Jarvis APK" --notes "Download Jarvis.apk"
